MODEL:
  NAME: BaseModel
  BACKBONE:
    NAME: resnet50
  K: 8
  NUM_TSLICE: 1
  SIMILARITY_GROUP: 1
  HEAD_CHOICE: [3]
  LOSS_WEIGHT: [1]
  MSP_LOSS_WEIGHT: 1
  CAT_PREV: true
  FPN_START_IDX: 1
  IS_BASIC: false
  NUM_BLOCKS: 1
DATASETS:
  TRAIN: [GEBD_train]
  TEST: [GEBD_val]
INPUT:
  END_TO_END: true
  SEQUENCE_LENGTH: 100
  ANNOTATORS: 2
SOLVER:
  BATCH_SIZE: 2
  LR: 0.01
  OPTIMIZER: SGD
  MAX_EPOCHS: 20
  MILESTONES: [6, 8, 12, 16]
TEST:
  DYNAMIC: false
  THRESHOLD: 0.3
  THH: [0.35, 0.35, 0.35]
  THL: [0.0, 0.0, 0.0]
  IGNORE: 5
  PAD_IGNORE: 2
  PRED_FILE: ""
OUTPUT_DIR: output/ablation/

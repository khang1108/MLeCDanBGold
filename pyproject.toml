[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aic"
version = "0.1.0"
description = "AIC Project"
readme = "README.md"
requires-python = ">= 3.11"
dependencies = [
    "gdown>=6.1.0",
    "huggingface-hub>=0.34, <2.0",
    "pandas>=2.0, <4.0",
    "pillow>=10.0, <13.0",
    "pyarrow>=14.0, <26.0",
    "pydantic>=2.0, <3.0",
    "pyyaml>=6.0, <7.0",
    "numpy>=1.24",
    "faiss-cpu>=1.7",
    "pydantic-settings>=2.14.2",
    "fastapi>=0.139.2",
    "uvicorn>=0.51.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.20",
    "tqdm>=4.66, <5.0",
]

[project.optional-dependencies]
embedding = [
    "sentence-transformers>=3.0, <6.0",
    "transformers>=4.30",
    "torch>=2.0",
]
reranking = [
    "accelerate>=1.12, <2.0",
    "qwen-vl-utils>=0.0.14, <0.1",
    "torch>=2.8, <3.0",
    "torchvision>=0.23, <1.0",
    "transformers>=4.57.1, <5.0",
]
s3 = [
    "boto3>=1.35, <2.0",
]
transcripts = [
    "av>=14, <19",
    "silero-vad>=6.2, <7.0",
    "pyannote.audio>=4.0.7, <5.0",
    "torch>=2.6, <2.10",
    "torchaudio>=2.6, <2.10",
    "transformers>=5.13, <6.0",
]
preprocessing = [
    "av>=14, <19",
    "einops>=0.8, <1.0",
    "opencv-python-headless>=4.10, <5.0",
    "tensorflow>=2.20, <3.0",
    "timm>=1.0, <2.0",
    "torch>=2.6, <3.0",
    "torchvision>=0.21, <1.0",
    "transformers>=4.56, <6.0",
    "yacs>=0.1.8, <1.0",
]
dev = [
    "httpx>=0.28.1",
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hcmai.data" = ["model_sources.yaml", "efficientgebd_runtime.yaml"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

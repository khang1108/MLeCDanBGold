[build-system]
requires = ["setuptools>=77.0.3", "wheel"]

[project]
name="lifelog-retrieval"
version="0.1.0"
description="A framework for Multimodal Model Retrieving"
readme="README.md"
require-python=">=3.10"
authors=[
    {name="Nguyen Phuc Khang"},
    {name="Le Huu Nguyen Huy"},
    {name="Nguyen Danh Phuong"},
    {name="Vo Quang Phuc"},
    {name="Truong Dinh Nhat Huy"}
]
keywords = [
    "lifelog retrieval",
    "text-to-frame retrieval",
    "multimodal retrieval"
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pillow>=10.0",
    "tqdm>=4.66",
    "opencv-python>=4.8",
    "matplotlib>=3.8",

    # Deep learning
    "torch>=2.2",
    "torchvision>=0.17",

    # Retrieval / indexing
    "faiss-cpu>=1.8.0",
    "rank-bm25>=0.2.2",

    # Vision-language models
    "open-clip-torch>=2.24",
    "transformers>=4.40",
    "accelerate>=0.30",

    # Utilities
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
    "mypy>=1.10",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]

notebook = [
    "notebook>=7.0",
    "ipywidgets>=8.1",
    "jupyterlab>=4.0",
]

ocr = [
    "easyocr>=1.7.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]
ignore = [
    "E501",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true

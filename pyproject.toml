[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aic"
version = "0.1.0"
description = "AIC Project"
readme = "README.md"
requires-python = ">= 3.11"
dependencies = [
    "gdown>=6.1.0",
    "pandas>=2.0, <3.0",
    "pillow>=10.0, <12.0",
    "pyarrow>=14.0, <22.0",
    "pydantic>=2.0, <3.0",
    "pyyaml>=6.0, <7.0",
    "numpy>=1.24",
    "faiss-cpu>=1.7",
]

[project.optional-dependencies]
embedding = [
    "transformers>=4.30",
    "torch>=2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

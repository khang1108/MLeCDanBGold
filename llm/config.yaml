server:
  # Nếu máy khác cần gọi API vào laptop này
  host: "0.0.0.0"
  port: 8100



caption_generation:
  model_checkpoint: "Qwen/Qwen3-VL-2B-Instruct"
  revision: null
  # Intermediate A6000 caption batch after the 512-image OOM test.
  max_batch_size: 320
  prompt: "Describe the image for video retrieval. Mention the main people, objects, actions, scene, location, and visible event. Be concise and factual."
  decoding:
    max_new_tokens: 64
    do_sample: false
  device: "cuda"
  dtype: "bfloat16"

# ============================================================
# EMBEDDING MODELS ONLY
# ============================================================
visual_embedding:
  backend: "siglip"
  name: "google/siglip2-base-patch16-224"
  revision: "75de2d55ec2d0b4efc50b3e9ad70dba96a7b2fa2"

  device: "cpu"

  # Also sets the maximum images accepted per visual embedding request.
  batch_size: 128

  image_size: 224

  # CPU -> float32 an toàn nhất
  dtype: "float32"


caption_embedding:
  backend: "bge_m3"
  name: "BAAI/bge-m3"
  revision: "5617a9f61b028005a4858fdac845db406aefb181"

  device: "cpu"

  # BGE-M3 khá nặng trên CPU
  batch_size: 8

  # Caption/query thực tế rất hiếm khi cần 8192 tokens
  # giảm xuống để hạn chế RAM + latency
  max_length: 1024

  dtype: "float32"


text_generation:
  checkpoint: "Qwen/Qwen3-4B"
  revision: "1cfa9a7208912126459214e8b04321603b3df60c"
  device: "cuda"
  dtype: "bfloat16"
  max_input_tokens: 4096
  max_new_tokens: 2048

object_detection:
  model: "yoloe-26l-seg-pf.pt"
  vocab_path: null
  min_confidence: 0.20
  top_k: 30
  device: "cuda"

services:
  backend:
    build:
      context: .
    env_file:
      - path: .env
        required: false
    environment:
      HCMAI_WORKSPACE_DB: ${HCMAI_WORKSPACE_DB:-/runtime/workspace.sqlite3}
    ports:
      - "${HCMAI_BACKEND_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts:ro
      - workspace_runtime:/runtime
    restart: unless-stopped

volumes:
  workspace_runtime:

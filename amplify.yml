version: 1
applications:
  - appRoot: frontend
    env:
      variables:
        AMPLIFY_MONOREPO_APP_ROOT: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
            - >-
              if [ -n "${REACT_APP_AWS_ACCESS_KEY_ID:-}" ] || [ -n
              "${REACT_APP_AWS_SECRET_ACCESS_KEY:-}" ]; then echo "Static AWS
              access keys must not be included in a browser build." >&2; exit
              1; fi
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: build
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*

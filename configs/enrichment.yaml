dataset:
  version: "hcmai2026_v1"
  root: "data"
  frames_path: "data/metadata/frames.parquet"

caption:
  output_dir: "artifacts/enrichment/caption"
  model_checkpoint: "florence-community/Florence-2-base-ft"
  revision: "269c8d8afb3ab2b993c43f6670f6eb879f764370"
  prompt: "<CAPTION>"
  decoding:
    max_new_tokens: 64
    num_beams: 3
    do_sample: false
  device: "cpu"
  precision: "fp32"
  dtype: "float32"
  image_size: 768
  batch_size: 4
  enrichment_version: "caption_v1"
  write_interval: 25

services:
  litellm:
    image: ghcr.io/berriai/litellm:v1.94.1
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    environment:
      LITELLM_LOG: ${LITELLM_LOG:-INFO}
      # These are route targets, not credentials. Keep them separate because
      # the /ready target cannot be derived from a pass-through target string.
      LITELLM_UPSTREAM_READY_URL: ${LITELLM_UPSTREAM_READY_URL:-https://api.iamphuckhang.dev/ready}
      LITELLM_UPSTREAM_CAPTIONS_URL: ${LITELLM_UPSTREAM_CAPTIONS_URL:-https://api.iamphuckhang.dev/v1/captions}
      LITELLM_UPSTREAM_OCR_URL: ${LITELLM_UPSTREAM_OCR_URL:-https://api.iamphuckhang.dev/v1/enrichment/ocr}
      LITELLM_UPSTREAM_TEXT_EMBEDDINGS_URL: ${LITELLM_UPSTREAM_TEXT_EMBEDDINGS_URL:-https://api.iamphuckhang.dev/v1/embeddings/text}
      LITELLM_UPSTREAM_IMAGE_EMBEDDINGS_URL: ${LITELLM_UPSTREAM_IMAGE_EMBEDDINGS_URL:-https://api.iamphuckhang.dev/v1/embeddings/images}
      LITELLM_UPSTREAM_DINO_EMBEDDINGS_URL: ${LITELLM_UPSTREAM_DINO_EMBEDDINGS_URL:-https://api.iamphuckhang.dev/v1/embeddings/dino}
      LITELLM_UPSTREAM_SHOT_SCORES_URL: ${LITELLM_UPSTREAM_SHOT_SCORES_URL:-https://api.iamphuckhang.dev/v1/preprocessing/shot-scores}
      LITELLM_UPSTREAM_EVENT_SCORES_URL: ${LITELLM_UPSTREAM_EVENT_SCORES_URL:-https://api.iamphuckhang.dev/v1/preprocessing/event-scores}
      LITELLM_UPSTREAM_EVENT_WINDOW_SCORES_URL: ${LITELLM_UPSTREAM_EVENT_WINDOW_SCORES_URL:-https://api.iamphuckhang.dev/v1/preprocessing/event-window-scores}
      LITELLM_UPSTREAM_ASR_URL: ${LITELLM_UPSTREAM_ASR_URL:-https://api.iamphuckhang.dev/v1/transcripts/asr}
      LITELLM_UPSTREAM_DIARIZATION_URL: ${LITELLM_UPSTREAM_DIARIZATION_URL:-https://api.iamphuckhang.dev/v1/transcripts/diarization}
      LITELLM_UPSTREAM_RERANK_URL: ${LITELLM_UPSTREAM_RERANK_URL:-https://api.iamphuckhang.dev/v1/rerank}
    volumes:
      - ./configs/litellm.yaml:/app/config.yaml:ro
    networks:
      - inference
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4000/health/liveliness"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: src/hcmai/Dockerfile
    ports:
      - "8000:8000"
    environment:
      HCMAI_CORS_ORIGINS: ${HCMAI_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # These paths are inside the image/container, not host-relative paths.
      HCMAI_CONFIG_PATH: /app/configs/baseline.yaml
      HCMAI_LLM_CONFIG: /app/thundercompute/config.yaml
      HCMAI_ENRICHMENT_CONFIG: /app/configs/enrichment.yaml
      HCMAI_DATASET_ROOT: /app/data
      HCMAI_METADATA_PATH: /app/artifacts/frame_store/frames.parquet
      HCMAI_INDEX_PATH: /app/artifacts/indexes/visual
      HCMAI_CONTEXT_INDEX_PATH: /app/artifacts/indexes/context
      HCMAI_ASR_SEGMENT_INDEX_PATH: /app/artifacts/indexes/asr_segments
      # Keep the upstream private: backend -> LiteLLM -> Cloudflare-hosted API.
      # The direct HCMAI_INFERENCE_BASE_URL in .env remains for non-Docker runs.
      HCMAI_INFERENCE_BASE_URL: http://litellm:4000
      # Runtime remote-inference credentials. These never go to the frontend.
      HCMAI_CF_ACCESS_CLIENT_ID: ${HCMAI_CF_ACCESS_CLIENT_ID:-}
      HCMAI_CF_ACCESS_CLIENT_SECRET: ${HCMAI_CF_ACCESS_CLIENT_SECRET:-}
      HCMAI_LOG_LEVEL: ${HCMAI_LOG_LEVEL:-INFO}
      # TRAKE reads these through its HCMAI_TRAKE_ environment prefix.
      HCMAI_TRAKE_TOP_K: ${HCMAI_TRAKE_TOP_K:-500}
      HCMAI_TRAKE_MAX_VIDEOS: ${HCMAI_TRAKE_MAX_VIDEOS:-200}
      HCMAI_TRAKE_RRF_K: ${HCMAI_TRAKE_RRF_K:-60}
      HCMAI_TRAKE_LAMBDA_GAP: ${HCMAI_TRAKE_LAMBDA_GAP:-1e-5}
      HCMAI_TRAKE_EVENT_POWER: ${HCMAI_TRAKE_EVENT_POWER:-1.0}
      HCMAI_TRAKE_CHUNK_SIZE: ${HCMAI_TRAKE_CHUNK_SIZE:-65536}
      HCMAI_TRAKE_CLUSTER_DELTA: ${HCMAI_TRAKE_CLUSTER_DELTA:-0.0}
    volumes:
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts:ro
    networks:
      - public
      - inference
    depends_on:
      litellm:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, pathlib, urllib.request;
          required = tuple(pathlib.Path(path) for path in (
          '/app/artifacts/indexes/visual/metadata.json',
          '/app/artifacts/indexes/context/metadata.json',
          '/app/artifacts/indexes/asr_segments/metadata.json'));
          assert all(path.is_file() for path in required), required;
          payload = json.load(urllib.request.urlopen(
          'http://127.0.0.1:8000/health', timeout=5));
          active = payload.get('retrieval_modalities', {});
          assert payload.get('status') == 'ok' and payload.get('ready') is True, payload;
          assert all(active.get(source, {}).get('active') for source in (
          'visual', 'context', 'asr')), payload
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - public
    restart: unless-stopped

networks:
  public:
  inference:

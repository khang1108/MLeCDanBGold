visual_embedding:
  backend: siglip
  model_name: google/siglip2-base-patch16-224
  revision: 75de2d55ec2d0b4efc50b3e9ad70dba96a7b2fa2
  device: cuda
  # A6000 starting point. Reduce only after measuring an actual OOM or latency
  # regression; the index builder preserves batch boundaries in its artifacts.
  batch_size: 128
  image_size: 224
  dtype: float32

evidence_embedding:
  backend: bge_m3
  model_name: BAAI/bge-m3
  revision: 5617a9f61b028005a4858fdac845db406aefb181
  device: cuda
  # Context and ASR texts are dynamically padded, so this is intentionally
  # tunable rather than a transport-level hard limit.
  batch_size: 128
  max_length: 8192
  dtype: float32

# Rollback compatibility: legacy text builders still read this field.
caption_embedding:
  backend: bge_m3
  model_name: BAAI/bge-m3
  revision: 5617a9f61b028005a4858fdac845db406aefb181
  device: cuda
  batch_size: 128
  max_length: 8192
  dtype: float32

server:
  host: "127.0.0.1"
  port: 8100

caption_generation:
  model_checkpoint: "Qwen/Qwen3-VL-8B-Instruct"
  revision: "0c351dd01ed87e9c1b53cbc748cba10e6187ff3b"
  prompt: "qwen vl"
  decoding:
    max_new_tokens: 160
    do_sample: false
  device: "cuda"
  dtype: "bfloat16"

visual_embedding:
  backend: "siglip"
  name: "google/siglip2-base-patch16-224"
  revision: "75de2d55ec2d0b4efc50b3e9ad70dba96a7b2fa2"
  device: "cuda"
  # Initial A6000 request/model batch. Tune against real image resolution and
  # VRAM telemetry rather than treating this as a universal maximum.
  batch_size: 128
  image_size: 224
  dtype: "float32"

caption_embedding:
  backend: "bge_m3"
  name: "BAAI/bge-m3"
  revision: "5617a9f61b028005a4858fdac845db406aefb181"
  device: "cuda"
  # `source: text` routes BGE requests here. Keep this aligned with the local
  # indexing model config so a remote build sends one useful GPU-sized batch.
  batch_size: 128
  max_length: 8192
  dtype: "float32"

reranker:
  checkpoint: "Qwen/Qwen3-VL-Reranker-2B"
  revision: null
  device: "cuda"
  dtype: "bfloat16"
  batch_size: 16
  max_length: 1024
  max_pixels: 262144

query_preparation:
  model_checkpoint: "Qwen/Qwen3-4B"
  revision: "1cfa9a7208912126459214e8b04321603b3df60c"
  device: "cuda"
  dtype: "bfloat16"
  max_new_tokens: 768
  do_sample_translation: false
  candidate_temperature: 0.6

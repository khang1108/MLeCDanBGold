# Initial deterministic settings for the isolated custom raw-video corpus.
# The preparation CLI writes these values as strict native JSON plus config_hash.
sample_period_ms: 1000
durable_long_edge: 1024
durable_jpeg_quality: 92
enrichment_jpeg_quality: 95
write_enrichment_images: true
extractor_version: hcmai-keyframes-extractor/0.1.0
frame_store_id: custom-raw1fps-v1
# These operator defaults are recorded in the generated strict JSON config.
run_root: runs/custom-raw1fps-v1
native_executable: build/keyframes_extraction/keyframe_extractor
yt_dlp_binary: yt-dlp

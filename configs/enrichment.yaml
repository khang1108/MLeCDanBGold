dataset:
  version: "hcmai2026_v1"
  root: "artifacts/frame_store"
  frames_path: "artifacts/frame_store/frames.parquet"

caption:
  output_dir: "artifacts/enrichment/caption"
  model_checkpoint: "florence-community/Florence-2-base-ft"
  revision: "0b03b6f15a4a211370fb204aee4e7dd48887ea37"
  prompt: "<CAPTION>"
  decoding:
    max_new_tokens: 64
    num_beams: 3
    do_sample: false
  device: "cpu"
  precision: "fp32"
  dtype: "float32"
  image_size: 768
  batch_size: 32
  enrichment_version: "caption_v1"
  write_interval: 2000

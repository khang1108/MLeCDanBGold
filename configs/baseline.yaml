dataset:
  version: "hcmai2026_v1"
  root: "data"
  frames_path: "data/metadata/frames.parquet"
  enrichment:
    caption_path: "artifacts/enrichment/caption/frame_enrichment.parquet"
    ocr_path: "artifacts/enrichment/ocr/frame_enrichment.parquet"
    asr_path: "artifacts/enrichment/asr/frame_enrichment.parquet"

index:
  type: "flat_ip"
  path: "artifacts/indexes/visual"
  caption_path: "artifacts/indexes/caption"
  ocr_path: "artifacts/indexes/ocr"
  asr_path: "artifacts/indexes/asr"
  subset_search_threshold: 100000
  text_embedding_filenames:
    caption: "caption_embeddings.npy"
    ocr: "ocr_embeddings.npy"
    asr: "asr_embeddings.npy"

search:
  candidate_count: 500
  rerank_count: 100
  temporal_window_ms: 3000
  reranker:
    required: false
  cache:
    enabled: true
    prompt_version: "query-v1"
    embedding_ttl_seconds: 3600
    embedding_max_entries: 4096
    embedding_max_bytes: 67108864
    thumbnail_ttl_seconds: 3600
    thumbnail_max_entries: 1024
    thumbnail_max_bytes: 134217728
    disk_enabled: false

  fusion:
    method: "rrf"
    rrf_k: 60
    modality_max_workers: 4
    required_sources: [visual]
    normalize_active_weights: true
    # Neutral starting point only. Tune per task on labeled validation queries.
    task_weights:
      kis: {visual: 1.0, caption: 1.0, ocr: 1.0, asr: 1.0}
      kisc: {visual: 1.0, caption: 1.0, ocr: 1.0, asr: 1.0}
      vkis: {visual: 1.0, caption: 1.0, ocr: 1.0, asr: 1.0}
      vqa: {visual: 1.0, caption: 1.0, ocr: 1.0, asr: 1.0}
      trake: {visual: 1.0, caption: 1.0, ocr: 1.0, asr: 1.0}

api:
  default_top_k: 20
  maximum_top_k: 100

inference:
  enabled: true
  base_url: "https://api.iamphuckhang.dev"
  timeout_seconds: 120
  connect_timeout_seconds: 5
  read_timeout_seconds: 120
  write_timeout_seconds: 30
  pool_timeout_seconds: 5
  max_attempts: 3
  backoff_initial_seconds: 0.1
  backoff_max_seconds: 2
  backoff_jitter_ratio: 0.2
  circuit_failure_threshold: 3
  circuit_cooldown_seconds: 30
  max_concurrency: 4
  minimum_retry_budget_seconds: 0.05

# Private pass-through gateway for the HCMAI remote inference contract.
#
# This is intentionally not an OpenAI model translation layer. The backend
# sends HCMAI's existing JSON and multipart requests unchanged, and LiteLLM
# forwards only the explicitly listed routes to the remote inference API.
model_list: []

general_settings:
  # There is no model database in this private pass-through deployment.
  store_model_in_db: false
  # The gateway is reachable only by the backend service on the Compose
  # network. Keep the boundary explicit so a future auth change is visible.
  pass_through_endpoints:
    - path: "/ready"
      target: os.environ/LITELLM_UPSTREAM_READY_URL
      auth: false
      forward_headers: true
      methods: ["GET"]
      timeout: 30

    - path: "/v1/captions"
      target: os.environ/LITELLM_UPSTREAM_CAPTIONS_URL
      auth: false
      forward_headers: true
      methods: ["POST"]
      timeout: 300

    - path: "/v1/enrichment/ocr"
      target: os.environ/LITELLM_UPSTREAM_OCR_URL
      auth: false
      forward_headers: true
      methods: ["POST"]
      timeout: 300

    - path: "/v1/embeddings/text"
      target: os.environ/LITELLM_UPSTREAM_TEXT_EMBEDDINGS_URL
      auth: false
      forward_headers: true
      methods: ["POST"]
      timeout: 300

    - path: "/v1/embeddings/images"
      target: os.environ/LITELLM_UPSTREAM_IMAGE_EMBEDDINGS_URL
      auth: false
      forward_headers: true
      methods: ["POST"]
      timeout: 300

    - path: "/v1/embeddings/dino"
      target: os.environ/LITELLM_UPSTREAM_DINO_EMBEDDINGS_URL
      auth: false
      forward_headers: true
      methods: ["POST"]
      timeout: 300

    - path: "/v1/preprocessing/shot-scores"
      target: os.environ/LITELLM_UPSTREAM_SHOT_SCORES_URL
      auth: false
      forward_headers: true
      methods: ["POST"]
      timeout: 300

    - path: "/v1/preprocessing/event-scores"
      target: os.environ/LITELLM_UPSTREAM_EVENT_SCORES_URL
      auth: false
      forward_headers: true
      methods: ["POST"]
      timeout: 300

    - path: "/v1/preprocessing/event-window-scores"
      target: os.environ/LITELLM_UPSTREAM_EVENT_WINDOW_SCORES_URL
      auth: false
      forward_headers: true
      methods: ["POST"]
      timeout: 300

    - path: "/v1/transcripts/asr"
      target: os.environ/LITELLM_UPSTREAM_ASR_URL
      auth: false
      forward_headers: true
      methods: ["POST"]
      timeout: 300

    - path: "/v1/transcripts/diarization"
      target: os.environ/LITELLM_UPSTREAM_DIARIZATION_URL
      auth: false
      forward_headers: true
      methods: ["POST"]
      timeout: 300

    - path: "/v1/rerank"
      target: os.environ/LITELLM_UPSTREAM_RERANK_URL
      auth: false
      forward_headers: true
      methods: ["POST"]
      timeout: 300

    -path: "/v1/query-suggestion"
      target: os.environ/LITELLM_UPSTREAM_QUERY_SUGGESTION_URL
      auth: false
      forward_headers: true
      method: ["POST"]
      timeout: 300

litellm_settings:
  # Requests contain images, OCR, transcripts, and questions. Do not retain
  # their message bodies in LiteLLM logs by default.
  turn_off_message_logging: true
  set_verbose: false

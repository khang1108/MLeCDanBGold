server:
  host: "127.0.0.1"
  port: 8100

caption_generation:
  model_checkpoint: "florence-community/Florence-2-base-ft"
  revision: "0b03b6f15a4a211370fb204aee4e7dd48887ea37"
  prompt: "<CAPTION>"
  decoding:
    max_new_tokens: 64
    num_beams: 3
    do_sample: false
  device: "cuda"
  dtype: "bfloat16"

visual_embedding:
  backend: "siglip"
  name: "google/siglip2-base-patch16-224"
  device: "cuda"
  batch_size: 32
  image_size: 224
  dtype: "float32"

caption_embedding:
  backend: "bge_m3"
  name: "BAAI/bge-m3"
  device: "cuda"
  batch_size: 16
  max_length: 8192
  dtype: "float32"

reranker:
  checkpoint: "Qwen/Qwen3-VL-Reranker-2B"
  revision: null
  device: "cuda"
  dtype: "bfloat16"
  batch_size: 16
  max_length: 1024
  max_pixels: 262144

# HCMAI_VQA_MODEL may override this pinned default on the VM.
vqa_model:
  checkpoint: "Qwen/Qwen2.5-VL-3B-Instruct"
  revision: null
  device: "cuda"
  dtype: "bfloat16"
  max_new_tokens: 256

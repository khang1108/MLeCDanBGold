dataset:
  version: "hcmai2026_v1"
  source: "btc_keyframes"
  btc_root: "data"
  data_root: "data"
  frame_store_id: "btc-keyframes-v1"
  frames_path: "artifacts/frame_store/frames.parquet"
  frame_store_output: "artifacts/frame_store"
  objects_root: "data/objects"

caption:
  output_dir: "artifacts/enrichment/captions"
  model_checkpoint: "florence-community/Florence-2-base-ft"
  revision: "0b03b6f15a4a211370fb204aee4e7dd48887ea37"
  prompt: "<CAPTION>"
  decoding:
    max_new_tokens: 64
    num_beams: 3
    do_sample: false
  device: "cuda"
  precision: "bf16"
  dtype: "bfloat16"
  image_size: 768
  batch_size: 64
  enrichment_version: "caption_v1"
  write_interval: 2000

ocr:
  output_dir: "artifacts/enrichment/ocr"
  enabled: true
  backend: "florence2"
  checkpoint: "florence-community/Florence-2-base-ft"
  revision: "0b03b6f15a4a211370fb204aee4e7dd48887ea37"
  device: "cuda"
  dtype: "bfloat16"
  batch_size: 32
  image_size: 768
  enrichment_version: "florence2_ocr_v1"
  artifact_version: "ocr-v1"
  min_region_confidence: 0.0
  min_context_quality: 0.5

objects:
  output_dir: "artifacts/enrichment/objects"
  artifact_version: "object-v1"
  summary_min_confidence: 0.25
  max_summary_labels: 20

transcript:
  output_dir: "artifacts/enrichment/transcripts"
  frames_path: "artifacts/frame_store/frames.parquet"
  frame_enrichment_path: "artifacts/enrichment/asr/frame_enrichment.parquet"
  pipeline_version: "transcript-pipeline-v1"
  schema_version: "transcript-segment-v1"
  enrichment_version: "asr-frame-v1"
  frame_evidence_window_ms: 2000
  asr:
    model_name: "Qwen/Qwen3-ASR-1.7B-hf"
    revision: "bcd2b5b7f32b480ab5790554cfa8347f246a14f3"
    device: "cuda"
    dtype: "bfloat16"
    audio_sample_rate: 16000
  diarization:
    enabled: true
    model_name: "pyannote/speaker-diarization-community-1"
    revision: "3533c8cf8e369892e6b79ff1bf80f7b0286a54ee"
    device: "cuda"
    audio_sample_rate: 16000

context:
  output_dir: "artifacts/enrichment/context"
  context_version: "frame-context-v1"
  caption_token_budget: 80
  ocr_token_budget: 80
  object_token_budget: 40
  min_ocr_quality: 0.5

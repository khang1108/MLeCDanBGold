[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aic"
version = "0.1.0"
description = "AIC Project"
readme = "README.md"
requires-python = ">= 3.11"
dependencies = [
    "gdown>=6.1.0",
    "pandas>=2.0, <4.0",
    "pillow>=10.0, <13.0",
    "pyarrow>=14.0, <26.0",
    "pydantic>=2.0, <3.0",
    "pyyaml>=6.0, <7.0",
    "numpy>=1.24",
    "faiss-cpu>=1.7",
    "pydantic-settings>=2.14.2",
    "fastapi>=0.139.2",
    "uvicorn>=0.51.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
embedding = [
    "transformers>=4.30",
    "torch>=2.0",
]
reranking = [
    "accelerate>=1.12, <2.0",
    "qwen-vl-utils>=0.0.14, <0.1",
    "torch>=2.8, <3.0",
    "torchvision>=0.23, <1.0",
    "transformers>=4.57, <5.0",
]
dev = [
    "httpx>=0.28.1",
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
